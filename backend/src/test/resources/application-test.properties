# הגדרות לבדיקות בלבד (ActiveProfiles("test")) - מסד נתונים בזיכרון (H2) במקום
# Neon האמיתי, כדי שהבדיקות ירוצו מהר, בבידוד, ולא יגעו בנתונים אמיתיים. ddl-auto
# create-drop בונה את הסכמה מחדש מה-entities בכל הרצה - אין צורך בקובץ מיגרציה נפרד
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.cors.allowed-origins=http://localhost:3000
